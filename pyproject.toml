[project]
name = "koe-input"
version = "0.3.0"
description = "自作の音声入力ツール（Typeless の内製版）"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "pynput>=1.8.1",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[tool.uv]
package = false
